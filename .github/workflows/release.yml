name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="2.0.0"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Target build version: ${VER}"

      - name: Install Packaging Utilities
        run: |
          brew install create-dmg || true

      - name: Build macOS App Bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh "$GITHUB_WORKSPACE/build"

      - name: Package DMG & ZIP Archives
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/package_dmg.sh "$GITHUB_WORKSPACE/build/HomeMonitor.app" "$GITHUB_WORKSPACE/build"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomeMonitor-${{ steps.version.outputs.version }}-macos
          path: |
            build/*.dmg
            build/*.zip
            build/checksums.txt
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('HomeMonitor v{0}', steps.version.outputs.version) }}
          files: |
            build/*.dmg
            build/*.zip
            build/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
